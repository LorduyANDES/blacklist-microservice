version: 0.2

# Construccion del microservicio de lista negra global.
#
# El proceso ejecuta las pruebas unitarias y, solo si todas pasan, construye la
# imagen del contenedor y la publica en Amazon ECR. La imagen publicada es la
# que despliega CodeDeploy sobre AWS Fargate.
#
# Las pruebas corren contra SQLite en un archivo temporal, de modo que la
# construccion no necesita un motor de base de datos ni credenciales de
# produccion.

env:
  variables:
    PYTHONUNBUFFERED: "1"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    ECR_REPO: "blacklist-microservice"

phases:

  install:
    runtime-versions:
      python: 3.13
    commands:
      - echo "=== Entorno de construccion ==="
      - python --version
      - docker --version
      - echo "Commit $CODEBUILD_RESOLVED_SOURCE_VERSION"

  pre_build:
    commands:
      - echo "=== Instalando dependencias ==="
      - python -m pip install --upgrade pip
      - pip install -r requirements-dev.txt

      - echo "=== Ejecutando las pruebas unitarias ==="
      # Esta es la puerta del proceso: en CodeBuild una fase que falla aborta
      # las siguientes, asi que una prueba rota impide que se llegue siquiera a
      # construir la imagen. El artefacto es una consecuencia de que las
      # pruebas pasen, no un paso independiente.
      - python -m pytest -v --junitxml=reports/pruebas-unitarias.xml

      - echo "=== Autenticando contra ECR ==="
      # La cuenta se deduce en tiempo de construccion en lugar de escribirse en
      # el repositorio, que es publico.
      - CUENTA=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRO=$CUENTA.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRO
      # La imagen se etiqueta con el commit que la origino: dada una tarea en
      # ejecucion, se puede saber exactamente de que codigo salio.
      - ETIQUETA=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:7}

  build:
    commands:
      - echo "=== Construyendo la imagen $ECR_REPO:$ETIQUETA ==="
      - docker build -t $REGISTRO/$ECR_REPO:$ETIQUETA -t $REGISTRO/$ECR_REPO:latest .

      - echo "=== Publicando en ECR ==="
      - docker push $REGISTRO/$ECR_REPO:$ETIQUETA
      - docker push $REGISTRO/$ECR_REPO:latest

  post_build:
    commands:
      - echo "=== Describiendo la imagen para la etapa de despliegue ==="
      # CodePipeline lee este archivo para sustituir el marcador <IMAGE1_NAME>
      # de la definicion de tarea por la imagen recien publicada.
      - printf '{"ImageURI":"%s"}' "$REGISTRO/$ECR_REPO:$ETIQUETA" > imageDetail.json
      - cat imageDetail.json
      - echo "=== Construccion finalizada ==="

artifacts:
  files:
    - imageDetail.json
  name: blacklist-microservice-$(date +%Y%m%d-%H%M%S)

reports:
  pruebas-unitarias:
    files:
      - reports/pruebas-unitarias.xml
    file-format: JUNITXML

cache:
  paths:
    - /root/.cache/pip/**/*
